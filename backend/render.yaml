services:
  - type: web
    name: revora-backend
    runtime: docker
    dockerfilePath: ./Dockerfile

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_KEY
        sync: false

      - key: SUPABASE_BUCKET
        sync: false

      - key: FRONTEND_URL
        sync: false

    healthCheckPath: /api/health
    autoDeploy: true
